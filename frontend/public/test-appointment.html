<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约测试页面</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }
        select, input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #409eff;
            color: white;
        }
        .btn-primary:hover {
            background: #66b1ff;
        }
        .btn-secondary {
            background: #909399;
            color: white;
        }
        .btn-secondary:hover {
            background: #b3b8bd;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f0f9ff;
            border-left: 4px solid #409eff;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 预约咨询测试页面</h1>

        <div class="form-group">
            <label>咨询师ID</label>
            <input type="number" id="counselorId" value="5" readonly>
        </div>

        <div class="form-group">
            <label>咨询师姓名</label>
            <input type="text" id="counselorName" value="张老师" readonly>
        </div>

        <div class="form-group">
            <label>咨询方式</label>
            <select id="consultationType">
                <option value="video">📹 视频咨询 (¥500/小时)</option>
                <option value="voice">📞 语音咨询 (¥300/小时)</option>
                <option value="offline">📍 线下咨询 (¥800/小时)</option>
            </select>
        </div>

        <div class="form-group">
            <label>选择日期</label>
            <input type="date" id="appointmentDate">
        </div>

        <div class="form-group">
            <label>您的姓名</label>
            <input type="text" id="userName" placeholder="请输入真实姓名">
        </div>

        <div class="form-group">
            <label>联系方式</label>
            <input type="tel" id="userContact" placeholder="请输入11位手机号" maxlength="11">
        </div>

        <div class="form-group">
            <label>问题描述</label>
            <textarea id="description" placeholder="请简要描述您希望咨询的问题（500字以内）"></textarea>
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="submitAppointment()">✅ 确认预约</button>
            <button class="btn-secondary" onclick="testAPI()">🔧 测试API</button>
        </div>

        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script>
        // 自动设置明天为默认日期
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('appointmentDate').valueAsDate = tomorrow;

        function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '🔄 正在测试API连接...';

            // 测试后端连接
            fetch('http://localhost:8000/api/counselor/5')
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        resultDiv.innerHTML = `
                            ✅ 后端API连接正常<br>
                            咨询师: ${data.data.name}<br>
                            价格: ¥${data.data.price_video}/小时<br>
                            状态: ${data.data.status}
                        `;
                    } else {
                        resultDiv.innerHTML = `⚠️ API响应异常: ${data.message}`;
                    }
                })
                .catch(error => {
                    resultDiv.innerHTML = `❌ API连接失败: ${error.message}`;
                });
        }

        function submitAppointment() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '🔄 正在提交预约...';

            // 获取表单数据
            const data = {
                counselor_id: parseInt(document.getElementById('counselorId').value),
                consultation_type: document.getElementById('consultationType').value,
                appointment_date: document.getElementById('appointmentDate').value,
                user_name: document.getElementById('userName').value,
                user_contact: document.getElementById('userContact').value,
                problem_description: document.getElementById('description').value
            };

            // 验证必填字段
            if (!data.user_name || !data.user_contact || !data.appointment_date) {
                resultDiv.innerHTML = '⚠️ 请填写所有必填字段';
                return;
            }

            // 手机号验证
            if (!/^1[3-9]\d{9}$/.test(data.user_contact)) {
                resultDiv.innerHTML = '⚠️ 请输入正确的11位手机号';
                return;
            }

            // 获取token（如果有）
            const token = localStorage.getItem('token');

            // 发送预约请求
            const headers = {
                'Content-Type': 'application/json'
            };

            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            fetch('http://localhost:8000/api/appointment/create', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.code === 200) {
                    resultDiv.innerHTML = `
                        ✅ 预约成功！<br><br>
                        预约单号: ${result.data.appointment_no || '生成中'}<br>
                        咨询方式: ${getConsultationTypeText(result.data.consultation_type)}<br>
                        预约时间: ${result.data.appointment_date}<br>
                        状态: 待确认
                    `;
                } else {
                    resultDiv.innerHTML = `❌ 预约失败: ${result.message || '未知错误'}`;
                }
            })
            .catch(error => {
                console.error('预约错误:', error);
                resultDiv.innerHTML = `❌ 网络错误: ${error.message}`;
            });
        }

        function getConsultationTypeText(type) {
            const types = {
                'video': '视频咨询',
                'voice': '语音咨询',
                'offline': '线下咨询'
            };
            return types[type] || type;
        }

        // 页面加载完成提示
        window.addEventListener('load', () => {
            console.log('预约页面加载完成');
            console.log('如需测试Vue应用状态，访问: http://localhost:5173/diagnostic.html');
        });
    </script>
</body>
</html>
