  redis:
    image: redis:7
    platform: linux/amd64
    container_name: soulstation-redis
    restart: always
    environment:
      REDIS_PASSWORD: redis123456
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass "redis123456"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123456", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - soulstation-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  soulstation-network:
    driver: bridge
